name: Build Frontend & Commit Dist

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '!frontend/dist/**'   # don't re-trigger on our own dist commit
  workflow_dispatch:

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Commit dist to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f frontend/dist
          git diff --cached --quiet && echo "No dist changes" && exit 0
          git commit -m "chore: update frontend dist [skip ci]"
          git push
