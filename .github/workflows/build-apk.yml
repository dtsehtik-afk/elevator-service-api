name: Build Android APK

on:
  workflow_dispatch:  # הפעלה ידנית מ-GitHub
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        run: npm run build

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android || true

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Copy background-runner native AAR
        working-directory: frontend
        run: |
          AAR="node_modules/@capacitor/background-runner/android/src/main/libs/android-js-engine-release.aar"
          if [ -f "$AAR" ]; then
            mkdir -p android/app/libs
            cp "$AAR" android/app/libs/
            echo "Copied android-js-engine-release.aar to app/libs"
          else
            echo "WARNING: AAR not found at $AAR"
            find node_modules/@capacitor/background-runner -name "*.aar" 2>/dev/null || true
          fi

      - name: Add location permissions to AndroidManifest
        working-directory: frontend/android/app/src/main
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>\n</manifest>|' AndroidManifest.xml

      - name: Decode keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > ~/.android/debug.keystore

      - name: Build APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akord-elevators
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
