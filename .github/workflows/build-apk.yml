name: Build Android APK

on:
  workflow_dispatch:  # הפעלה ידנית מ-GitHub
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        run: npm run build

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android || true

      - name: Copy google-services.json for FCM
        working-directory: frontend
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          echo "google-services.json copied to android/app/"

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Patch Gradle files for Kotlin compatibility
        run: |
          # Root cause: cap sync generates app/capacitor.build.gradle with hardcoded VERSION_21.
          # AGP 8.x automatically aligns Kotlin jvmTarget with targetCompatibility — and with
          # JDK 21 it infers jvmTarget=21 for ALL modules including background-runner (Kotlin 1.8.x
          # which doesn't support jvmTarget=21).
          # Fix: JDK 17 in CI + patch every VERSION_21 occurrence in generated/library files.

          # 1. app/capacitor.build.gradle — generated by cap sync with hardcoded VERSION_21
          sed -i 's/VERSION_21/VERSION_17/g' frontend/android/app/capacitor.build.gradle
          echo "=== app/capacitor.build.gradle after patch ==="
          cat frontend/android/app/capacitor.build.gradle

          # 2. capacitor-android library — has VERSION_21 in its own compileOptions
          sed -i 's/VERSION_21/VERSION_17/g' frontend/node_modules/@capacitor/android/capacitor/build.gradle
          echo "=== capacitor-android build.gradle (relevant lines) ==="
          grep -n "VERSION\|jvmTarget\|compileOptions" frontend/node_modules/@capacitor/android/capacitor/build.gradle

          # 3. variables.gradle — may or may not have VERSION_21; patch defensively
          sed -i 's/VERSION_21/VERSION_17/g' frontend/android/variables.gradle
          echo "=== variables.gradle ==="
          cat frontend/android/variables.gradle

          # 4. background-runner: hardcode kotlin 2.0.21 and add explicit kotlinOptions
          BG="frontend/node_modules/@capacitor/background-runner/android/build.gradle"
          sed -i "s/ext\.kotlin_version = .*/ext.kotlin_version = '2.0.21'/" "$BG"
          if ! grep -q 'kotlinOptions' "$BG"; then
            sed -i 's/    lintOptions {/    kotlinOptions {\n        jvmTarget = "17"\n    }\n    lintOptions {/' "$BG"
          fi
          echo "=== background-runner build.gradle after patch ==="
          cat "$BG"

          # 5. capacitor-push-notifications — also has VERSION_21
          PN="frontend/node_modules/@capacitor/push-notifications/android/build.gradle"
          sed -i 's/VERSION_21/VERSION_17/g' "$PN"
          echo "=== push-notifications build.gradle after patch ==="
          grep -n "VERSION\|jvmTarget\|compileOptions\|sourceCompatibility\|targetCompatibility" "$PN" || true

          # 6. capacitor-geolocation — patch defensively
          GEO="frontend/node_modules/@capacitor/geolocation/android/build.gradle"
          [ -f "$GEO" ] && sed -i 's/VERSION_21/VERSION_17/g' "$GEO" || true

          # 7. capacitor-community/background-geolocation — patch defensively
          BGGEO="frontend/node_modules/@capacitor-community/background-geolocation/android/build.gradle"
          if [ -f "$BGGEO" ]; then
            sed -i 's/VERSION_21/VERSION_17/g' "$BGGEO"
            echo "=== background-geolocation build.gradle after patch ==="
            grep -n "VERSION\|jvmTarget\|compileOptions" "$BGGEO" || true
          fi

      - name: Copy background-runner native AAR
        working-directory: frontend
        run: |
          AAR="node_modules/@capacitor/background-runner/android/src/main/libs/android-js-engine-release.aar"
          if [ -f "$AAR" ]; then
            mkdir -p android/app/libs
            cp "$AAR" android/app/libs/
            echo "Copied android-js-engine-release.aar to app/libs"
          else
            echo "WARNING: AAR not found at $AAR"
            find node_modules/@capacitor/background-runner -name "*.aar" 2>/dev/null || true
          fi

      - name: Add location and notification permissions to AndroidManifest
        working-directory: frontend/android/app/src/main
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>\n</manifest>|' AndroidManifest.xml
          # Register the BackgroundGeolocation foreground service inside <application>
          sed -i 's|</application>|    <service android:name="com.equimaps.capacitor_background_geolocation.BackgroundGeolocationService" android:enabled="true" android:exported="true" android:foregroundServiceType="location"/>\n        </application>|' AndroidManifest.xml

      - name: Decode keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > ~/.android/debug.keystore

      - name: Debug gradle files
        run: |
          echo "=== app/capacitor.build.gradle ==="
          cat frontend/android/app/capacitor.build.gradle 2>/dev/null || echo NOT_FOUND
          echo "=== root build.gradle ==="
          cat frontend/android/build.gradle 2>/dev/null || echo NOT_FOUND
          echo "=== variables.gradle ==="
          cat frontend/android/variables.gradle 2>/dev/null || echo NOT_FOUND
          echo "=== background-runner build.gradle ==="
          cat frontend/node_modules/@capacitor/background-runner/android/build.gradle 2>/dev/null || echo NOT_FOUND

      - name: Build APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akord-elevators
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
