name: Build Android APK

on:
  workflow_dispatch:  # הפעלה ידנית מ-GitHub
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React app
        working-directory: frontend
        run: npm run build

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android || true

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Patch Java/Kotlin version to 17
        run: |
          # Gradle init script — runs before any project script, overrides jvmTarget
          # for capacitor-background-runner which uses old Kotlin that doesn't know JVM 21
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix-bg-runner-jvm.gradle << 'EOF'
allprojects {
    afterEvaluate { proj ->
        if (proj.name.contains('background') && proj.name.contains('runner')) {
            proj.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile.class).configureEach {
                kotlinOptions.jvmTarget = "17"
            }
            proj.android?.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
}
EOF
          echo "Init script created:"
          cat ~/.gradle/init.d/fix-bg-runner-jvm.gradle

          # Also patch files as belt-and-suspenders
          find frontend/android/capacitor-background-runner -name "*.gradle" 2>/dev/null | while read f; do
            sed -i "s/jvmTarget = '21'/jvmTarget = '17'/g" "$f"
            sed -i 's/jvmTarget = "21"/jvmTarget = "17"/g' "$f"
            sed -i 's/JvmTarget\.JVM_21/JvmTarget.JVM_17/g' "$f"
            sed -i 's/VERSION_21/VERSION_17/g' "$f"
            sed -i 's/kotlin-gradle-plugin:1\.9\.[0-9][0-9]*/kotlin-gradle-plugin:1.9.21/g' "$f"
            echo "=== $f after patch ==="
            cat "$f"
          done

      - name: Copy background-runner native AAR
        working-directory: frontend
        run: |
          AAR="node_modules/@capacitor/background-runner/android/src/main/libs/android-js-engine-release.aar"
          if [ -f "$AAR" ]; then
            mkdir -p android/app/libs
            cp "$AAR" android/app/libs/
            echo "Copied android-js-engine-release.aar to app/libs"
          else
            echo "WARNING: AAR not found at $AAR"
            find node_modules/@capacitor/background-runner -name "*.aar" 2>/dev/null || true
          fi

      - name: Add location permissions to AndroidManifest
        working-directory: frontend/android/app/src/main
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>\n</manifest>|' AndroidManifest.xml

      - name: Decode keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > ~/.android/debug.keystore

      - name: Build APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: akord-elevators
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
